experiment:
  seed: 42
  model: openai/gpt-6-luna
  reasoning_effort: medium
  max_tokens: 16384
  concurrency: 2
  progress_batch_size: 2
  cache: false

paths:
  math_eval_repo: ../../../math-frontier-eval

splits:
  search: 30
  dev: 20
  test: 50

domains:
  - algebra
  - combinatorics
  - geometry
  - number_theory

proposer:
  model: gpt-6-luna
  reasoning_effort: high
  candidates_per_iteration: 3

judge:
  enabled: true
  model: openai/gpt-6-luna
  reasoning_effort: low
  max_tokens: 1024
  concurrency: 2
  batch_size: 2
  cache: false

